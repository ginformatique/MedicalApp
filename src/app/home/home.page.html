<!-- home.page.html -->
<ion-content>
  <div class="ad-section">
    <div class="carousel">
      <div class="carousel-inner">
        <div class="carousel-item">
          <img src="assets/doctor1.webp" alt="Publicité 1">
        </div>
        <div class="carousel-item">
          <img src="assets/doctor1.webp" alt="Publicité 3">
        </div>
        <div class="carousel-item">
          <img src="assets/doctor1.webp" alt="Publicité 3">
        </div>
      </div>
    </div>
    <button class="carousel-control prev" (click)="prevSlide()">&#10094;</button>
    <button class="carousel-control next" (click)="nextSlide()">&#10095;</button>
  </div>
  <div class="search-section">
    <ion-searchbar 
      class="rounded-searchbar" 
      placeholder="Rechercher un Médecin..." 
      animated
      (ionInput)="searchMedecins($event)"
      (ionClear)="searchMedecins()">
    </ion-searchbar>
  </div>  
  
  <ion-list>
    <ion-list-header>
      <ion-label style="color:#605eea">Médecins disponibles</ion-label>
    </ion-list-header>
  
    <ion-item *ngFor="let medecin of medecins" (click)="goToDoctorProfile(medecin._id)">
      <ion-avatar slot="start">
        <img [src]="medecin.image || 'assets/default-doctor.png'" [alt]="medecin.nom">
      </ion-avatar>
      <ion-label>
        <h2>{{ medecin.nom }}</h2>
        <p>{{ medecin.specialite }}</p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <ion-label>Chargement...</ion-label>
    </ion-item>
    <ion-item *ngIf="!loading && medecins.length === 0">
      <ion-label>Aucun médecin trouvé</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
