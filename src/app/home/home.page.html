<ion-content>
  <div class="gif-section">
    <img src="assets/gihy2.webp" alt="Animation médicale">
  </div>

  <div class="search-section">
    <ion-searchbar 
      class="rounded-searchbar" 
      placeholder="Rechercher un Médecin..." 
      animated
      [(ngModel)]="searchQuery"
      (ionInput)="onSearchInput($event)"
      (ionClear)="clearSearch()">
    </ion-searchbar>
    <div class="search-container">
      <select [(ngModel)]="selectedSpecialty" (ngModelChange)="searchMedecins()">
        <option value="">Toutes les spécialités</option>
        <option *ngFor="let specialty of specialties" [value]="specialty">{{ specialty }}</option>
      </select>
      <select [(ngModel)]="sortBy" (ngModelChange)="sortMedecins()">
        <option value="note-desc">Trier par note (décroissant)</option>
        <option value="note-asc">Trier par note (croissant)</option>
        <option value="nom">Trier par nom</option>
        <option value="specialite">Trier par spécialité</option>
      </select>
    </div>
  </div>  

  <ion-list>
    <ion-list-header>
      <ion-label style="color:#605eea">Médecins disponibles</ion-label>
    </ion-list-header>
  
    <ion-item *ngFor="let medecin of medecins" (click)="goToDoctorProfile(medecin._id)">
      <ion-avatar slot="start">
        <img [src]="medecin.image || 'assets/default-doctor.png'" [alt]="medecin.nom">
      </ion-avatar>
      <ion-label>
        <h2>{{ medecin.nom }}</h2>
        <p>{{ medecin.specialite }}</p>
        <p class="rating">
          <span *ngFor="let star of getFullStars(medecin.note)" class="star">★</span>
          <span *ngIf="hasHalfStar(medecin.note)" class="star">☆</span>
          <span *ngFor="let empty of getEmptyStars(medecin.note)" class="star">☆</span>
          <span> ({{ medecin.note }}/5)</span>
        </p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <ion-label>Chargement...</ion-label>
    </ion-item>
    <ion-item *ngIf="!loading && medecins.length === 0">
      <ion-label>Aucun médecin trouvé pour cette spécialité ou recherche.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
