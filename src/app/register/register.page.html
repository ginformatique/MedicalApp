<ion-content class="ion-padding">
  <div class="register-container">
    <form class="register-form">
      <ion-item>
        <ion-label position="floating">Nom</ion-label>
        <ion-input type="text" [(ngModel)]="lastName" name="lastName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Prénom</ion-label>
        <ion-input type="text" [(ngModel)]="firstName" name="firstName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Rôle</ion-label>
        <ion-select [(ngModel)]="role" name="role">
          <ion-select-option value="patient">Patient</ion-select-option>
          <ion-select-option value="medecin">Médecin</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Date de naissance</ion-label>
        <ion-input type="date" [(ngModel)]="dateOfBirth" name="dateOfBirth"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Adresse</ion-label>
        <ion-input type="text" [(ngModel)]="address" name="address"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Téléphone</ion-label>
        <ion-input type="tel" [(ngModel)]="phone" name="phone"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Mot de passe</ion-label>
        <ion-input type="password" [(ngModel)]="password" name="password"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Confirmer le mot de passe</ion-label>
        <ion-input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"></ion-input>
      </ion-item>

      <ion-button expand="block" class="register-button" (click)="register()">
        S'inscrire
      </ion-button>

      <div class="login-link">
        <p>Déjà inscrit ?</p>
        <ion-button fill="clear" routerLink="/login">
          Se connecter
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
