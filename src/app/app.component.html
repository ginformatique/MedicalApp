<ion-app>
  <ion-split-pane contentId="main-content">
    <!-- Menu latéral -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-item routerLink="/home" routerLinkActive="selected">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Accueil</ion-label>
          </ion-item>
          
          <ion-item routerLink="/medical-history" routerLinkActive="selected">
            <ion-icon name="medical-outline" slot="start"></ion-icon>
            <ion-label>Historique Médical</ion-label>
          </ion-item>
          
          <ion-item routerLink="/medical-documents" routerLinkActive="selected">
            <ion-icon name="document-text-outline" slot="start"></ion-icon>
            <ion-label>Documents Médicaux</ion-label>
          </ion-item>
          
          <ion-item routerLink="/doctors" routerLinkActive="selected">
            <ion-icon name="medkit-outline" slot="start"></ion-icon>
            <ion-label>Médecins</ion-label>
          </ion-item>
          
          <ion-item routerLink="/login" routerLinkActive="selected">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            <ion-label>Connexion</ion-label>
          </ion-item>
        </ion-list>
        
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
  
   <ion-header *ngIf="!(router.url.includes('/patient') || router.url.includes('/doctor-profile')  || router.url.includes('/register')  || router.url.includes('/login')    )"   class="purple-tab-bar">
    <ion-toolbar >
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Patient care+</ion-title>
    </ion-toolbar>
  </ion-header>
  
      
<ion-footer class="purple-tab-bar">
  <ion-toolbar>
    <ion-row routerLink="/home" class="ion-justify-content-around">
      <ion-col class="tab-item" size="3">
        <ion-icon name="home"></ion-icon>

      </ion-col>
      <ion-col class="tab-item" size="3">
        <ion-icon name="apps-outline"></ion-icon>
        
      </ion-col>
      <ion-col class="tab-item" size="3">
        <ion-icon name="search"></ion-icon>
      </ion-col>
      <ion-col  routerLink="/profile" class="tab-item" size="3">
        <ion-icon name="person"></ion-icon>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
</ion-app>
