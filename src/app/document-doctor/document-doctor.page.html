<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-title>Documents des Patients</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">


  <ion-list class="documents-list" *ngIf="documents.length > 0">
    <ion-list-header>
      <ion-label>Documents Reçus</ion-label>
    </ion-list-header>

    <ion-item-sliding *ngFor="let doc of documents">
      <ion-item (click)="openDocumentModal(doc)">
        <ion-icon slot="start" [name]="getFileIcon(doc.fileType)"></ion-icon>
        <ion-label>
          <h2>{{ doc.filename }}</h2>
          <p>Patient: {{ doc.patientName }}</p>
          <p>{{ doc.description }}</p>
          <p class="meta-info">
            <ion-badge color="medium" *ngIf="doc.isUrgent">URGENT</ion-badge>
            <span>Envoyé le {{ doc.uploadDate | date:'mediumDate' }}</span>
            <span *ngIf="doc.consultationId"> | Consultation #{{ doc.consultationId }}</span>
            <span> | Statut: {{ doc.status }}</span>
          </p>
        </ion-label>
      </ion-item>
    </ion-item-sliding>
  </ion-list>

  <div class="empty-state" *ngIf="documents.length === 0 && !isLoading">
    <ion-icon name="documents-outline"></ion-icon>
    <p>Aucun document reçu</p>
  </div>

  <ion-spinner *ngIf="isLoading" name="crescent" class="loading-spinner"></ion-spinner>
</ion-content>
