<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Profil Patient</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="!isEditMode" (click)="toggleEditMode()">
        <ion-icon name="pencil-outline"></ion-icon>
      </ion-button>
      <ion-button *ngIf="isEditMode" (click)="saveChanges()">
        <ion-icon name="save-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="refreshNotifications()">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-badge color="warning" *ngIf="getUnreadNotificationCount() > 0" class="notification-badge">
          {{ getUnreadNotificationCount() }}
        </ion-badge>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Profile Section -->
  <div class="profile-container" *ngIf="user">
    <ion-avatar class="profile-image">
      <img [src]="'assets/IMG_0114.JPG'" alt="Patient Photo">
    </ion-avatar>
    <h2 class="profile-name" *ngIf="!isEditMode">{{ user.firstName }} {{ user.lastName }}</h2>
    <ion-item *ngIf="isEditMode">
      <ion-input label="Prénom" [(ngModel)]="user.firstName"></ion-input>
    </ion-item>
    <ion-item *ngIf="isEditMode">
      <ion-input label="Nom" [(ngModel)]="user.lastName"></ion-input>
    </ion-item>
  </div>

  <!-- Contact Information -->
  <ion-card class="info-card" *ngIf="user">
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        Informations personnelles
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="none" *ngIf="!isEditMode && user.phone">
        <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
        <ion-label>{{ user.phone }}</ion-label>
      </ion-item>
      <ion-item *ngIf="isEditMode">
        <ion-input label="Téléphone" [(ngModel)]="user.phone"></ion-input>
      </ion-item>
      
      <ion-item lines="none" *ngIf="!isEditMode">
        <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
        <ion-label>{{ user.email }}</ion-label>
      </ion-item>
      <ion-item *ngIf="isEditMode">
        <ion-input label="Email" [(ngModel)]="user.email" type="email"></ion-input>
      </ion-item>
      
      <ion-item lines="none" *ngIf="!isEditMode && user.address">
        <ion-icon name="home-outline" slot="start" color="primary"></ion-icon>
        <ion-label>{{ user.address }}</ion-label>
      </ion-item>
      <ion-item *ngIf="isEditMode">
        <ion-input label="Adresse" [(ngModel)]="user.address"></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <!-- Notifications Section -->
  <ion-card class="info-card">
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="notifications-outline" slot="start"></ion-icon>
        Notifications
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-spinner *ngIf="isLoadingNotifications" name="crescent" class="ion-text-center"></ion-spinner>
      <ion-list *ngIf="!isLoadingNotifications && notifications.length > 0; else noNotifications">
        <ion-item *ngFor="let notification of notifications" 
                 [class.unread]="!notification.isRead"
                 button
                 (click)="markAsRead(notification._id)">
          <ion-icon name="notifications-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h3 [ngStyle]="{'font-weight': notification.isRead ? 'normal' : 'bold'}">{{ notification.message }}</h3>
            <p>{{ notification.createdAt | date:'dd MMM yyyy, HH:mm' }}</p>
          </ion-label>
          <ion-icon *ngIf="!notification.isRead" name="ellipse" slot="end" color="primary"></ion-icon>
        </ion-item>
      </ion-list>
      <ng-template #noNotifications>
        <ion-item lines="none" *ngIf="!isLoadingNotifications">
          <ion-label class="ion-text-center">
            <ion-icon name="notifications-off-outline" size="large"></ion-icon>
            <p>Aucune notification</p>
          </ion-label>
        </ion-item>
      </ng-template>
    </ion-card-content>
  </ion-card>
</ion-content>

<style>
.notification-badge {
  position: absolute;
  top: 5px;
  right: 5px;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 50%;
}
</style>
