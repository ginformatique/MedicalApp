<ion-header class="header-gradient">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="close-btn" (click)="dismiss()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Détails du document</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding custom-content">
  <ion-card class="document-card document-fade-in">
    <ion-card-header>
      <ion-card-title>
        <ion-icon [name]="getFileIcon(document.fileType)"></ion-icon>
        {{ document.filename }}
      </ion-card-title>
      <ion-card-subtitle>
        {{ getDocumentTypeLabel(document.type) }}
        <ion-badge *ngIf="document.isUrgent">URGENT</ion-badge>
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-label>
            <h3>Description</h3>
            <p>{{ document.description || 'Aucune description' }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Date d'ajout</h3>
            <p>{{ document.uploadDate | date:'medium' }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Taille du fichier</h3>
            <p>{{ document.fileSize }}</p>
          </ion-label>
        </ion-item>

        <ion-item *ngIf="document.tags && document.tags.length > 0" class="tags-item">
          <ion-label>
            <h3>Tags</h3>
            <div class="tags-container">
              <ion-chip *ngFor="let tag of document.tags">
                <ion-label>{{ tag }}</ion-label>
              </ion-chip>
            </div>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <div class="action-buttons-container">
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <ion-button expand="block" class="download-btn" (click)="downloadDocument()">
            <ion-icon slot="start" name="download"></ion-icon>
            Télécharger
          </ion-button>
        </ion-col>
        <ion-col size="6">
          <ion-button expand="block" class="delete-btn" (click)="confirmDelete()">
            <ion-icon slot="start" name="trash"></ion-icon>
            Supprimer
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
